[project]
name = "truthlens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi<1.0",
    "httpx",
    "jinja2",
    "numpy",
    "pandas",
    "pillow==10.4.0",
    "pre-commit>=4.6.2",
    "pydantic-settings",
    "pytest>=9.1.1",
    "python-dotenv",
    "python-multipart",
    "ruff>=0.16.10",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "uvicorn[standard]",
]

[project.scripts]
truthlens = "truthlens:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
