[project]
name = "truthlens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi<1.0",
    "httpx",
    "jinja2",
    "numpy",
    "pandas",
    "pillow==10.4.0",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "uvicorn[standard]",
]

[project.scripts]
truthlens = "truthlens:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
