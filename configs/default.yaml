weights:
  s1_frame: 0.30
  s2_temporal: 0.25
  s3_freq: 0.20
  s4_audio: 0.10
  s5_meta: 0.10
  s6_semantic: 0.05

# frame sampling
sample_frames: 2
target_fps_sample: 1

# verdict thresholds (percent). Calibrated on Celeb-DF subset (61 videos)
thresholds:
  ai: 58.0
  real: 42.0
  min_signals: 2
  strong_ai: 65.0
  strong_real: 35.0
  stable_delta: 0.15

# optional learned fusion model
fusion_model: artifacts/models/fusion_lr.pkl

# frame-level deepfake classifier (ONNX). Download with: python scripts/download_models.py
frame_model: artifacts/models/community_forensics/model_int8.onnx

# linear probe (embedding ONNX + sklearn head) trained on labelled data.
# Build with: python scripts/train_probe.py
probe_dir: artifacts/models/community_probe
