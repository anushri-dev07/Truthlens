<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · TruthLens</title>
  <style>
    :root{color-scheme:dark;--bg:#0a1020;--panel:#121a2b;--border:#29354a;--text:#edf2fa;--muted:#aebbd0;--accent:#7dd3fc;--error:#ffb4b4}
    *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{min-height:100dvh;margin:0;background:radial-gradient(900px 420px at 50% -15%,#1b2a42,var(--bg));color:var(--text);display:grid;grid-template-rows:auto 1fr}
    header{padding:1.1rem clamp(1rem,4vw,2.5rem)}a{color:inherit}.brand{display:flex;gap:.65rem;align-items:center;text-decoration:none;font-weight:700}.dot{width:10px;height:10px;border-radius:50%;background:#22d3ee;box-shadow:0 0 20px #22d3ee70}
    main{width:min(420px,calc(100% - 2rem));margin:auto;padding:2rem 0}.eyebrow{color:var(--accent);font-size:.74rem;text-transform:uppercase}.panel{padding:clamp(1.2rem,5vw,2rem);background:var(--panel);border:1px solid var(--border);border-radius:.8rem}h1{font-size:1.6rem;margin:.25rem 0 1.4rem}form{display:grid;gap:1rem}label{display:grid;gap:.4rem;font-size:.86rem;color:var(--muted)}input{width:100%;padding:.75rem .8rem;border:1px solid var(--border);border-radius:.45rem;background:#0a1020;color:var(--text);font-size:1rem}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.btn{display:inline-flex;justify-content:center;padding:.75rem 1rem;border:1px solid #51c5e8;border-radius:.45rem;background:linear-gradient(90deg,#22d3ee,#a78bfa);color:#08111f;font-weight:700;text-decoration:none;cursor:pointer}.error{padding:.7rem .8rem;border:1px solid #f8717170;border-radius:.45rem;background:#ef444418;color:var(--error);font-size:.85rem}.foot{color:var(--muted);font-size:.85rem;margin:1rem 0 0}
  </style>
</head>
<body>
  <header><a class="brand" href="/"><span class="dot"></span>TruthLens</a></header>
  <main><section class="panel">
    <p class="eyebrow">Personal analysis history</p>
    <h1>Log in</h1>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Email<input name="email" type="email" autocomplete="email" maxlength="254" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" maxlength="128" required></label>
      <button class="btn" type="submit">Log in</button>
    </form>
    <p class="foot">No account? <a href="/register">Create one</a></p>
    <p class="foot"><a href="/">Continue as guest</a></p>
  </section></main>
</body>
</html>
