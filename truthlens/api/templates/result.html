<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TruthLens - AI Video Detector</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:2rem;background:#0f172a;color:#e2e8f0}
    .card{max-width:720px;margin:0 auto;background:#111827;padding:2rem;border-radius:1rem;box-shadow:0 10px 30px rgba(0,0,0,.3)}
    table{width:100%;border-collapse:collapse;margin-top:1rem}
    th,td{padding:.5rem;border-bottom:1px solid #1f2937}
    .bar{background:#1f2937;height:8px;border-radius:4px;overflow:hidden}
    .fill{background:linear-gradient(90deg,#ef4444,#f59e0b,#10b981);height:100%}
  </style>
</head>
<body>
  <div class="card">
    <h1>TruthLens Result</h1>
    <h2>AI Probability: <strong>{{ ai_probability }}%</strong></h2>
    <div class="bar"><div class="fill" style="width: {{ ai_probability }}%"></div></div>
    <h3>Signal Breakdown</h3>
    <table>
      <thead><tr><th>Signal</th><th>AI Prob</th><th>Evidence</th></tr></thead>
      <tbody>
      {% for s in signals %}
        <tr>
          <td>{{ s.name }}</td>
          <td>{{ (s.prob_ai*100)|round(1) }}%</td>
          <td>{{ s.evidence|join(', ') }}</td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
    <p><a href="/">Back</a></p>
  </div>
</body>
</html>
