<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TruthLens - Result</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: radial-gradient(1200px 800px at 50% -10%, #1f2937, #0b1020); --card: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03)); --border: rgba(255,255,255,0.12); --text:#e5e7eb; --muted:#9ca3af; }
    *{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
    body{margin:0;background:var(--bg);color:var(--text);min-height:100dvh}
    header{display:flex;align-items:center;justify-content:space-between;padding:1rem 2rem}
    .brand{display:flex;gap:.75rem;align-items:center}
    .dot{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#22d3ee);box-shadow:0 0 40px 6px rgba(34,211,238,.25)}
    main{max-width:920px;margin:0 auto;padding:2rem;display:grid;gap:1rem}
    .card{backdrop-filter:blur(12px);background:var(--card);border:1px solid var(--border);border-radius:1rem;padding:clamp(1rem,2vw,2rem)}
    .kpi{display:flex;flex-wrap:wrap;gap:1rem;align-items:center}
    .big{font-size:clamp(3rem,6vw,6rem);font-weight:600;margin:0}
    .bar{background:rgba(255,255,255,.08);height:10px;border-radius:999px;overflow:hidden}
    .fill{height:100%;background:linear-gradient(90deg,#22c55e,#f59e0b,#ef4444)}
    table{width:100%;border-collapse:collapse;margin-top:1rem}
    th,td{padding:.6rem;border-bottom:1px solid var(--border);text-align:left}
    .muted{color:var(--muted)}
    .btn{display:inline-flex;padding:.7rem 1rem;border-radius:.6rem;border:1px solid var(--border);color:var(--text);text-decoration:none;background:linear-gradient(90deg,rgba(34,211,238,.18),rgba(167,139,250,.18))}
  </style>
</head>
<body>
  <header><div class="brand"><div class="dot"></div><strong>TruthLens</strong></div></header>
  <main>
    <section class="card">
      <div class="kpi">
        <div>
          <h1 class="big">{{ ai_probability }}%</h1>
          <div class="muted">AI Probability</div>
        </div>
        <div style="flex:1;min-width:240px">
          <div class="bar"><div class="fill" style="width:{{ ai_probability }}%"></div></div>
        </div>
      </div>
      <a class="btn" href="/">Analyze Another</a>
    </section>
    <section class="card">
      <h2>Signal Breakdown</h2>
      <table>
        <thead><tr><th>Signal</th><th>AI Prob</th><th>Evidence</th></tr></thead>
        <tbody>
          {% for s in signals %}
          <tr><td>{{ s.name }}</td><td>{{ (s.prob_ai*100)|round(1) }}%</td><td class="muted">{{ s.evidence|join(', ') }}</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
